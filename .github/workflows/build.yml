name: Native builds
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified GUI.Forms source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-gui-forms.py --github-cli
      - name: Build and verify the musl package on Linux x64
        run: docker run --rm -v "$PWD:/work" -w /work alpine:3.24.2 sh scripts/ci-linux.sh
      - name: Launch the package on the glibc host
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          test ! -e /lib/ld-musl-x86_64.so.1
          set +e
          xvfb-run -a timeout 3 'dist/RainstarPaint/Rainstar Paint'
          result=$?
          set -e
          test "$result" = 124
          GUI_FORMS_FONT_DIR="$PWD/dist/RainstarPaint/bin/fonts" xvfb-run -a \
            "$PWD/dist/RainstarPaint/lib/ld-musl-x86_64.so.1" \
            --library-path "$PWD/dist/RainstarPaint/lib" "$PWD/build-linux/paint-forms-native-tests"
      - uses: actions/upload-artifact@v4
        with:
          name: rainstar-paint-linux-x64
          path: dist/*.tar.gz
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified GUI.Forms source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch-gui-forms.py --github-cli
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libwebp mingw-w64-x86_64-dav1d
            git
      - name: Build, run native checks and package
        shell: msys2 {0}
        run: sh scripts/ci-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rainstar-paint-windows-x64
          path: dist/*.zip
